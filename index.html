<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовый сайт — Калькулятор и Угадай число</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px);
        }
        h2 {
            color: #fff;
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }
        h2 span {
            display: inline-block;
            margin-right: 8px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 18px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-row input {
            flex: 1;
            min-width: 100px;
        }
        input, select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s, background 0.2s;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        input:focus, select:focus {
            border-color: #a78bfa;
            background: rgba(255, 255, 255, 0.12);
        }
        select option {
            background: #1e1b4b;
            color: #fff;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.35);
        }
        .btn:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 25px rgba(124, 58, 237, 0.5);
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: none;
        }
        .btn-success {
            background: linear-gradient(135deg, #059669, #34d399);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.35);
        }
        .btn-success:hover {
            box-shadow: 0 6px 25px rgba(5, 150, 105, 0.5);
        }
        .btn-danger {
            background: linear-gradient(135deg, #dc2626, #f87171);
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.35);
        }
        .btn-danger:hover {
            box-shadow: 0 6px 25px rgba(220, 38, 38, 0.5);
        }
        .result-box {
            margin-top: 18px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e0e0e0;
            font-size: 1.1rem;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
        }
        .result-box.success {
            border-color: #34d399;
            color: #6ee7b7;
        }
        .result-box.error {
            border-color: #f87171;
            color: #fca5a5;
        }
        .result-box.info {
            border-color: #60a5fa;
            color: #93c5fd;
        }
        .history {
            margin-top: 14px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px 4px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
        .history::-webkit-scrollbar {
            width: 4px;
        }
        .history::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .history-item {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .game-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .game-controls .btn {
            flex: 1;
            min-width: 80px;
        }
        .attempts {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            margin-top: 30px;
            width: 100%;
        }
        @media (max-width: 600px) {
            .card {
                padding: 20px 16px;
            }
            h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Калькулятор -->
        <div class="card">
            <h2><span>🧮</span> Калькулятор</h2>
            <div class="input-group">
                <div class="input-row">
                    <input type="number" id="calcNum1" placeholder="Первое число" value="0">
                    <select id="calcOp">
                        <option value="+">➕ +</option>
                        <option value="-">➖ −</option>
                        <option value="*">✖️ ×</option>
                        <option value="/">➗ ÷</option>
                    </select>
                    <input type="number" id="calcNum2" placeholder="Второе число" value="0">
                </div>
                <button class="btn" id="calcBtn">= Посчитать</button>
            </div>
            <div class="result-box" id="calcResult">Введите числа и нажмите «Посчитать»</div>
            <div class="history" id="calcHistory"></div>
        </div>

        <!-- Игра "Угадай число" -->
        <div class="card">
            <h2><span>🎯</span> Угадай число</h2>
            <p style="color: rgba(255,255,255,0.5); text-align: center; margin-bottom: 14px; font-size: 0.95rem;">
                Я загадал число от 1 до 100. Попробуй угадать!
            </p>
            <div class="input-group">
                <input type="number" id="guessInput" placeholder="Твоё предположение" min="1" max="100">
                <div class="game-controls">
                    <button class="btn btn-success" id="guessBtn">🔍 Проверить</button>
                    <button class="btn btn-secondary" id="newGameBtn">🔄 Новая игра</button>
                </div>
            </div>
            <div class="result-box info" id="guessResult">Введи число и нажми «Проверить»</div>
            <div class="attempts" id="attemptsDisplay">Попыток: 0</div>
            <div class="history" id="guessHistory"></div>
        </div>

        <div class="footer">
            Тестовый сайт · Калькулятор + Угадай число · Создано AI
        </div>
    </div>

    <script>
        // ==================== КАЛЬКУЛЯТОР ====================
        const calcNum1 = document.getElementById('calcNum1');
        const calcNum2 = document.getElementById('calcNum2');
        const calcOp = document.getElementById('calcOp');
        const calcBtn = document.getElementById('calcBtn');
        const calcResult = document.getElementById('calcResult');
        const calcHistory = document.getElementById('calcHistory');

        function addCalcHistory(entry) {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.textContent = entry;
            calcHistory.prepend(div);
            if (calcHistory.children.length > 20) {
                calcHistory.removeChild(calcHistory.lastChild);
            }
        }

        calcBtn.addEventListener('click', function() {
            const a = parseFloat(calcNum1.value);
            const b = parseFloat(calcNum2.value);
            const op = calcOp.value;

            if (isNaN(a) || isNaN(b)) {
                calcResult.textContent = '❌ Пожалуйста, введите оба числа';
                calcResult.className = 'result-box error';
                return;
            }

            let result;
            let symbol = op;
            switch (op) {
                case '+': result = a + b; break;
                case '-': result = a - b; break;
                case '*': result = a * b; break;
                case '/':
                    if (b === 0) {
                        calcResult.textContent = '❌ На ноль делить нельзя!';
                        calcResult.className = 'result-box error';
                        addCalcHistory(`${a} ${symbol} ${b} = ❌ Ошибка`);
                        return;
                    }
                    result = a / b;
                    break;
                default:
                    calcResult.textContent = '❌ Неизвестная операция';
                    calcResult.className = 'result-box error';
                    return;
            }

            const formatted = Number.isInteger(result) ? result : result.toFixed(4);
            calcResult.textContent = `✅ ${a} ${symbol} ${b} = ${formatted}`;
            calcResult.className = 'result-box success';
            addCalcHistory(`${a} ${symbol} ${b} = ${formatted}`);
        });

        // ==================== ИГРА "УГАДАЙ ЧИСЛО" ====================
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        let gameOver = false;

        const guessInput = document.getElementById('guessInput');
        const guessBtn = document.getElementById('guessBtn');
        const newGameBtn = document.getElementById('newGameBtn');
        const guessResult = document.getElementById('guessResult');
        const attemptsDisplay = document.getElementById('attemptsDisplay');
        const guessHistory = document.getElementById('guessHistory');

        function addGuessHistory(text, type) {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.textContent = text;
            if (type === 'win') div.style.color = '#34d399';
            else if (type === 'error') div.style.color = '#f87171';
            else div.style.color = 'rgba(255,255,255,0.6)';
            guessHistory.prepend(div);
            if (guessHistory.children.length > 20) {
                guessHistory.removeChild(guessHistory.lastChild);
            }
        }

        function updateAttempts() {
            attemptsDisplay.textContent = `Попыток: ${attempts}`;
        }

        function resetGame() {
            secretNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            gameOver = false;
            guessInput.value = '';
            guessInput.disabled = false;
            guessBtn.disabled = false;
            guessResult.textContent = '🔄 Новая игра! Число от 1 до 100 загадано.';
            guessResult.className = 'result-box info';
            updateAttempts();
            guessHistory.innerHTML = '';
        }

        guessBtn.addEventListener('click', function() {
            if (gameOver) {
                guessResult.textContent = '🎯 Игра окончена! Нажми «Новая игра»';
                guessResult.className = 'result-box info';
                return;
            }

            const val = parseInt(guessInput.value, 10);
            if (isNaN(val) || val < 1 || val > 100) {
                guessResult.textContent = '⚠️ Введи число от 1 до 100';
                guessResult.className = 'result-box error';
                return;
            }

            attempts++;
            updateAttempts();

            if (val === secretNumber) {
                guessResult.textContent = `🎉 Поздравляю! Ты угадал число ${secretNumber} за ${attempts} ${attempts === 1 ? 'попытку' : (attempts < 5 ? 'попытки' : 'попыток')}!`;
                guessResult.className = 'result-box success';
                gameOver = true;
                guessInput.disabled = true;
                guessBtn.disabled = true;
                addGuessHistory(`✅ ${val} — Угадал! (${attempts} поп.)`, 'win');
            } else if (val < secretNumber) {
                guessResult.textContent = `⬆️ ${val} — слишком мало. Попробуй больше!`;
                guessResult.className = 'result-box info';
                addGuessHistory(`${val} — мало ⬆️`);
            } else {
                guessResult.textContent = `⬇️ ${val} — слишком много. Попробуй меньше!`;
                guessResult.className = 'result-box info';
                addGuessHistory(`${val} — много ⬇️`);
            }

            guessInput.value = '';
            guessInput.focus();
        });

        newGameBtn.addEventListener('click', resetGame);

        // Enter в поле ввода игры
        guessInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                guessBtn.click();
            }
        });

        // Enter в полях калькулятора
        document.querySelectorAll('#calcNum1, #calcNum2').forEach(el => {
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    calcBtn.click();
                }
            });
        });

        console.log('Сайт загружен! Калькулятор и игра "Угадай число" готовы.');
    </script>
</body>
</html>
